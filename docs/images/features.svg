<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><style>text{font-family:Ubuntu,Cantarell,Arial,sans-serif}</style><rect x="20" y="20" width="370" height="175" rx="18" fill="#1c7ed6"/><text x="48" y="88" font-size="44" font-weight="700" fill="#fff">8x</text><text x="48" y="132" font-size="26" font-weight="700" fill="#fff">Segmented</text><text x="48" y="165" font-size="16" fill="#fff" opacity="0.92">Up to 8 connections per file, resumes after crashes</text><rect x="410" y="20" width="370" height="175" rx="18" fill="#12b886"/><text x="438" y="88" font-size="44" font-weight="700" fill="#fff">▶</text><text x="438" y="132" font-size="26" font-weight="700" fill="#fff">Video grabber</text><text x="438" y="165" font-size="16" fill="#fff" opacity="0.92">One-click quality menu for YouTube and more</text><rect x="800" y="20" width="370" height="175" rx="18" fill="#f08c00"/><text x="828" y="88" font-size="44" font-weight="700" fill="#fff">⏱</text><text x="828" y="132" font-size="26" font-weight="700" fill="#fff">Scheduler</text><text x="828" y="165" font-size="16" fill="#fff" opacity="0.92">Queues, time windows, speed limits</text><rect x="20" y="215" width="370" height="175" rx="18" fill="#ae3ec9"/><text x="48" y="283" font-size="44" font-weight="700" fill="#fff">⇩</text><text x="48" y="327" font-size="26" font-weight="700" fill="#fff">Browser takeover</text><text x="48" y="360" font-size="16" fill="#fff" opacity="0.92">Brave, Chrome, Chromium, Edge, Firefox</text><rect x="410" y="215" width="370" height="175" rx="18" fill="#e03131"/><text x="438" y="283" font-size="44" font-weight="700" fill="#fff">⛁</text><text x="438" y="327" font-size="26" font-weight="700" fill="#fff">Site grabber</text><text x="438" y="360" font-size="16" fill="#fff" opacity="0.92">Crawl a site and pick the files you want</text><rect x="800" y="215" width="370" height="175" rx="18" fill="#0c8599"/><text x="828" y="283" font-size="44" font-weight="700" fill="#fff">HLS</text><text x="828" y="327" font-size="26" font-weight="700" fill="#fff">Streams</text><text x="828" y="360" font-size="16" fill="#fff" opacity="0.92">HLS/DASH to MP4 via ffmpeg</text></svg>