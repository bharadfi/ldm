[workspace]
resolver = "2"
members = ["crates/zdm-core", "crates/zdm-proto", "crates/zdmd", "crates/zdm-cli", "crates/zdm-nmhost", "crates/zdm-gui"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
rand = "0.9"
zdm-core = { path = "crates/zdm-core" }
zdm-proto = { path = "crates/zdm-proto" }
